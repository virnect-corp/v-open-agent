# 사용법은 README.md "개발 환경 (Docker)" 참고
name: v-open-agent

x-server-build: &server-build
  context: .
  dockerfile: docker/server.Dockerfile
  args:
    UID: ${VOA_UID:-1000}
    GID: ${VOA_GID:-1000}

services:
  # 빌드/검사/테스트: ruff, mypy, pytest. 네트워크 없음 (DAT-03: 오프라인 통과)
  dev:
    image: v-open-agent:server-dev
    build:
      <<: *server-build
      target: dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    network_mode: none
    command: ["scripts/check.sh"]

  # Stage C0 실모델 검증 (ADR-0007). `scripts/vision.sh <command>`
  # - dev 이미지 + vision 그룹(torch CPU, transformers, Pillow). 네트워크 없음, 다운로드 금지.
  # - 가중치는 사용자가 apps/server/var/models/<model_id>/ 에 직접 받아 둔다(git 제외).
  vision:
    profiles: ["vision"]
    image: v-open-agent:vision-dev
    build:
      <<: *server-build
      target: vision-dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    network_mode: none
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VOA_MODEL_WEIGHTS_DIR: /workspace/apps/server/var/models
    command: ["bash"]

  # 미세조정 학습 (ADR-0008, TASK-38). GPU PC(amd64)에서만: `scripts/train.sh <args>`
  # - 이미지는 그 PC에서 빌드한다. 네트워크 없음, 다운로드 금지. 데이터와 가중치는 var/ 아래(git 제외).
  train:
    profiles: ["train"]
    image: v-open-agent:train-cuda
    build:
      <<: *server-build
      target: train-cuda
    volumes:
      - .:/workspace
    working_dir: /workspace/apps/server
    network_mode: none
    shm_size: "4gb"               # DataLoader workers
    gpus: all
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    command: ["bash"]

  # 영상 -> 프레임 폴더 추출 (ADR-0007). `scripts/extract-frames.sh <video> <name> [fps]`
  # - 영상 폴더는 실행 시 /input 에 읽기 전용으로 마운트한다. 네트워크 없음.
  frames:
    profiles: ["tools"]
    image: v-open-agent:frame-tools
    build:
      <<: *server-build
      target: frame-tools
    volumes:
      - .:/workspace
    working_dir: /workspace
    network_mode: none

  # 관리자/시뮬 페이지 로직 테스트 (TASK-45). `scripts/ui-test.sh`
  # - 공식 node 이미지, npm 패키지 없이 node 내장 테스트 러너만 쓴다. 네트워크 없음, 소스 읽기 전용.
  ui-test:
    profiles: ["tools"]
    image: node:22.12.0-slim
    volumes:
      - ./apps/server:/workspace/apps/server:ro
    working_dir: /workspace/apps/server
    network_mode: none
    user: "${VOA_UID:-1000}:${VOA_GID:-1000}"
    command: ["node", "--test", "tests/ui/*.test.mjs"]

  # 서버 실행 (SPEC 8.4). `docker compose --profile server up server`
  # - 의존성은 이미지에, 소스는 저장소 bind mount(/workspace)로 쓴다. 소스 수정은 재빌드 없이 반영.
  # - 모델: 가중치 폴더를 /models 에 읽기 전용으로 마운트하고, profile/manifest 는 환경변수로 고른다.
  #   예) VOA_POLICY_PROFILE=config/profiles/<p>.yaml VOA_MODEL_WEIGHTS_HOST=~/weights \
  #       docker compose --profile server up server
  server:
    profiles: ["server"]
    image: v-open-agent:server
    # voa-data 볼륨의 소유자가 이미지 빌드 UID에 따라 달라지지 않게 실행 사용자를 고정한다
    # (TASK-46: server 와 server-vision 이 같은 볼륨을 쓴다). 서버는 /data 에만 쓴다.
    user: "1000:1000"
    build:
      <<: *server-build
      target: server
    working_dir: /workspace/apps/server   # SPEC 8.3 상대 경로 기준
    command: ["python", "-m", "voa.server"]
    environment:
      PYTHONPATH: /workspace/apps/server/src
      VOA_PROFILE: dev-mock
      VOA_BIND: 0.0.0.0           # 컨테이너 내부 bind. 외부 노출 범위는 ports 가 결정
      VOA_ALLOW_INSECURE_DEV: "false" # 0.0.0.0 bind에서 secret 생략 금지
      VOA_EXPOSURE: loopback      # 0.0.0.0 bind 이지만 ports 가 호스트 127.0.0.1 로만 내보냄 (ADR-0009, TLS 불필요)
      VOA_PORT: "8765"
      VOA_DB_PATH: /data/voa.sqlite3
      VOA_POLICY_PROFILE: ${VOA_POLICY_PROFILE:-config/profiles/indoor_research_v0.yaml}
      VOA_MODELS_DIR: ${VOA_MODELS_DIR:-config/models}
      VOA_MODEL_WEIGHTS_DIR: /models
      VOA_DEVICES_FILE: ${VOA_DEVICES_FILE:-config/devices.yaml}
    volumes:
      - .:/workspace
      - ${VOA_MODEL_WEIGHTS_HOST:-./var/models}:/models:ro
      - voa-data:/data            # 메타데이터 DB 는 공유 폴더가 아닌 도커 볼륨에 둔다
    ports:
      - "127.0.0.1:8765:8765"     # 기본은 호스트 loopback 만. LAN 노출은 pilot 단계에서 결정

  # 실모델 서버 (ADR-0009, TASK-43). `docker compose --profile server-vision up server-vision`
  # - server 와 같고 이미지에 vision(CPU torch)이 더해져 업로드된 프레임을 실제 모델로 추론한다.
  #   예) VOA_DEFAULT_MISSION=fire_c1 docker compose --profile server-vision up server-vision
  server-vision:
    profiles: ["server-vision"]
    image: v-open-agent:server-vision
    # voa-data 볼륨의 소유자가 이미지 빌드 UID에 따라 달라지지 않게 실행 사용자를 고정한다
    # (TASK-46: server 와 server-vision 이 같은 볼륨을 쓴다). 서버는 /data 에만 쓴다.
    user: "1000:1000"
    build:
      <<: *server-build
      target: server-vision
    working_dir: /workspace/apps/server
    command: ["python", "-m", "voa.server"]
    environment:
      PYTHONPATH: /workspace/apps/server/src
      VOA_PROFILE: dev-mock
      VOA_BIND: 0.0.0.0
      VOA_EXPOSURE: loopback      # ports 가 호스트 127.0.0.1 로만 내보냄 (ADR-0009)
      VOA_ALLOW_INSECURE_DEV: "false"
      VOA_PORT: "8765"
      VOA_DB_PATH: /data/voa.sqlite3
      VOA_POLICY_PROFILE: ${VOA_POLICY_PROFILE:-config/profiles/indoor_research_v0.yaml}
      VOA_DEFAULT_MISSION: ${VOA_DEFAULT_MISSION:-}
      VOA_MODELS_DIR: ${VOA_MODELS_DIR:-config/models}
      VOA_MODEL_WEIGHTS_DIR: /models
      VOA_ACTIVE_CONFIG_DIR: /data/config
      VOA_DEVICES_FILE: ${VOA_DEVICES_FILE:-config/devices.yaml}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HOME: /tmp                  # 고정 실행 사용자는 이미지의 홈 폴더 소유자가 아닐 수 있다
    volumes:
      - .:/workspace
      - ${VOA_MODEL_WEIGHTS_HOST:-./apps/server/var/models}:/models:ro
      - voa-data:/data
    ports:
      - "127.0.0.1:8765:8765"

  # GPU 서버 (TASK-50). NVIDIA GPU가 있는 PC에서 `docker compose --profile server-cuda up server-cuda`
  # - server-vision 과 같고 torch가 CUDA 빌드이며 모델을 GPU에 올린다(VOA_INFERENCE_DEVICE=cuda).
  server-cuda:
    profiles: ["server-cuda"]
    image: v-open-agent:server-cuda
    user: "1000:1000"
    build:
      <<: *server-build
      target: server-cuda
    working_dir: /workspace/apps/server
    command: ["python", "-m", "voa.server"]
    gpus: all
    environment:
      PYTHONPATH: /workspace/apps/server/src
      VOA_PROFILE: dev-mock
      VOA_BIND: 0.0.0.0
      VOA_EXPOSURE: loopback      # ports 가 호스트 127.0.0.1 로만 내보냄 (원격은 SSH 터널)
      VOA_ALLOW_INSECURE_DEV: "false"
      VOA_PORT: "8765"
      VOA_DB_PATH: /data/voa.sqlite3
      VOA_POLICY_PROFILE: ${VOA_POLICY_PROFILE:-config/profiles/indoor_research_v0.yaml}
      VOA_DEFAULT_MISSION: ${VOA_DEFAULT_MISSION:-}
      VOA_MODELS_DIR: ${VOA_MODELS_DIR:-config/models}
      VOA_MODEL_WEIGHTS_DIR: /models
      VOA_ACTIVE_CONFIG_DIR: /data/config
      VOA_DEVICES_FILE: ${VOA_DEVICES_FILE:-config/devices.yaml}
      VOA_INFERENCE_DEVICE: cuda
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HOME: /tmp
    volumes:
      - .:/workspace
      - ${VOA_MODEL_WEIGHTS_HOST:-./apps/server/var/models}:/models:ro
      - voa-data:/data
    ports:
      - "127.0.0.1:8765:8765"

volumes:
  voa-data:
