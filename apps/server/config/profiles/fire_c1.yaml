# Stage C1 fire profile (ADR-0008). First real scenario: flames anywhere in view.
# Smoke is emitted by the model and recorded, but no scenario uses it yet.
# v2 (TASK-39): evidence model is the C1b fine-tuned detector `rtdetr-r18-dfire`.
# The C1a zero-shot model (omdet-turbo-fire) stays registered for exploration only:
# it scored a candle body and office walls as fire (ADR-0008 Results).
# min_score 0.05: the C1b model learns IoU-aware scores that stay low (ADR-0008
# Results, TASK-38). On D-Fire val, 0.06 gives 1% and 0.041 gives 5% false fire
# images; on walk01 (office) no frame exceeded 0.050. Revisit with OQ-06.
profile_id: fire_c1
profile_version: 2
degraded_notice_text: "카메라 상태를 확인할 수 없어 감지가 제한됩니다."
params:
  min_score: 0.05
  roi_min_overlap: 0.3
  confirm_frames: 3
  clear_frames: 3
  staleness_ms: 1000
  unknown_after_ms: 1500
  warning_ttl_ms: 4000
  window_ms: 5000
  window_max_items: 256
scenarios:
  - id: fire_in_view
    required_kinds: [object_detection]
    required_models: {object_detection: rtdetr-r18-dfire}
    required_streams: [camera_0]
    labels: [fire]
    motion_classes: []
    roi: [0.0, 0.0, 1.0, 1.0]
    blocking_flags: [occluded, frame_dropped]
    warning_text: "불꽃으로 보이는 것이 감지되었습니다. 주변을 확인하세요."
    severity: attention
